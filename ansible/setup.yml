# This playbook contains setup steps to be applied on new servers
- hosts: wlb-prod-ubu24
  become: true
  vars_files:
    - vars/production.yml

  tasks:
    - name: Make sure we have a 'docker' group
      group:
        name: docker
        state: present

    - name: Configure admin users
      user:
        name: "{{ item }}"
        shell: /bin/bash
        groups: docker,sudo,admin
        append: yes
      with_items: "{{ admin_users }}"

    - name: Configure authorized keys for SSH
      authorized_key:
        user: "{{ item.user }}"
        key: "{{ item.key }}"
        state: present
      with_items: "{{ authorized_keys }}"

    - name: Enable sudo without using password for sudo group
      lineinfile:
        path: /etc/sudoers
        state: present
        regexp: '^%sudo'
        line: '%sudo ALL=(ALL) NOPASSWD: ALL'
        validate: 'visudo -cf %s'

    - name: Enable sudo without using password for admin group
      lineinfile:
        path: /etc/sudoers
        state: present
        regexp: '^%admin'
        line: '%admin ALL=(ALL) NOPASSWD: ALL'
        validate: 'visudo -cf %s'

    - name: Disable password authentication for root in sshd config
      lineinfile:
        path: /etc/ssh/sshd_config
        state: present
        regexp: '^#?PermitRootLogin'
        line: 'PermitRootLogin prohibit-password'

    - name: Ensure docker config dir exists
      file:
        path: /etc/docker
        state: directory

    - name: Copy docker daemon.json
      copy:
        src: "conf/daemon.json"
        dest: "/etc/docker/daemon.json"

    - name: Configure sub user IDs
      copy:
        content: "dockremap:100000:65536"
        dest: "/etc/subuid"

    - name: Configure sub group IDs
      copy:
        content: "dockremap:100000:65536"
        dest: "/etc/subgid"

    - name: Download GPG keys for apt repositories
      get_url:
        url: "{{ item.src }}"
        dest: "{{ item.dest }}"
      with_items:
        - { src: "https://download.docker.com/linux/ubuntu/gpg", dest: "/tmp/docker.gpg" }
        - { src: "https://keys.datadoghq.com/DATADOG_APT_KEY_CURRENT.public", dest: "/tmp/datadog.gpg" }

    - name: Import GPG keys into keyring
      command: "gpg --batch --no-default-keyring --keyring {{ item.keyring }} --import {{ item.key }}"
      with_items:
        - { key: "/tmp/docker.gpg", keyring: "/usr/share/keyrings/docker-keyring.gpg" }
        - { key: "/tmp/datadog.gpg", keyring: "/usr/share/keyrings/datadog-archive-keyring.gpg"}

    - name: Register apt repositories
      apt_repository:
        repo: "{{ item.repo }}"
        filename: "{{ item.filename }}"
        update_cache: false
      with_items:
        - repo: "deb [signed-by=/usr/share/keyrings/docker-keyring.gpg] https://download.docker.com/linux/ubuntu noble stable"
          filename: "docker"
        - repo: "deb [signed-by=/usr/share/keyrings/datadog-archive-keyring.gpg] https://apt.vector.dev/ stable vector-0"
          filename: "vector"

    - name: Update apt cache
      apt: update_cache=yes

    - name: Update all packages to the latest version
      apt:
        upgrade: dist

    - name: Install packages
      apt: name={{ apt_packages }} state=latest

    - name: Ensure app dirs are present
      file:
        path: "{{ item }}"
        state: directory
        group: docker
        mode: '2775'
      with_items:
        - "{{ app_basedir }}"
        - "{{ app_basedir }}/backups"
        - "{{ app_basedir }}/secrets"

    - name: Install cronjobs
      cron:
        name: "{{ item.name }}"
        minute: "{{ item.minute }}"
        hour: "{{ item.hour }}"
        user: "{{ item.user }}"
        job: "{{ item.job }}"
        cron_file: "{{ item.name }}"
      with_items:
        - name: backup-lima
          minute: "5"
          hour: "4"
          user: root
          job: "cd {{ app_basedir }} && ./backup-lima.sh create > /dev/null 2>&1"
        - name: backup-wordpress
          minute: "15"
          hour: "4"
          user: root
          job: "cd {{ app_basedir }} && ./backup-wordpress.sh create > /dev/null 2>&1"
        - name: certbot-renew
          minute: "25"
          hour: "4"
          user: root
          job: "cd {{ app_basedir }} && ./certbot-renew.sh > /dev/null 2>&1"
        - name: wordpress-cron
          minute: "*/5"
          user: root
          job: "cd {{ app_basedir }} && docker compose exec -u www-data wordpress php wp-cron.php > /dev/null 2>&1"
